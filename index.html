<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerebral Garden — Gesture Bloom</title>
<style>
  :root{
    --ink: #e9e3d3;
    --ink-dim: #8d8a7c;
    --bg: #0a0d0c;
    --bg-2: #0f1412;
    --line: rgba(233,227,211,0.14);
    --cyan: #4fd8c4;
    --rose: #e8567a;
    --gold: #e0b25a;
    --mono: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: Georgia, 'Times New Roman', serif;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background: radial-gradient(ellipse at 50% 30%, var(--bg-2) 0%, var(--bg) 70%);
    font-family: var(--mono);
    color: var(--ink);
  }
  #stage{ position:fixed; inset:0; }
  canvas#art{ position:absolute; inset:0; display:block; width:100%; height:100%; }

  /* ---- camera preview ---- */
  #camWrap{
    position:absolute; top:18px; left:18px; z-index:20;
    width:190px; border:1px solid var(--line);
    background: rgba(10,13,12,0.55);
    backdrop-filter: blur(6px);
    border-radius: 2px;
    padding:8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #camLabel{
    font-size:9px; letter-spacing:0.14em; text-transform:uppercase;
    color: var(--ink-dim); margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;
  }
  #camLabel .dot{
    width:6px; height:6px; border-radius:50%; background:#e8567a;
    box-shadow:0 0 6px #e8567a; display:inline-block; margin-right:5px;
    animation: pulse 1.6s infinite ease-in-out;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  #camBox{ position:relative; width:100%; aspect-ratio: 4/3; overflow:hidden; border:1px solid var(--line); }
  #video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transform: scaleX(-1);
    filter: grayscale(0.35) contrast(1.05) brightness(0.9);
  }
  #gestureTag{
    position:absolute; left:0; right:0; bottom:0;
    padding:4px 6px; font-size:11px; text-align:center;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    letter-spacing:0.05em;
  }
  #gestureTag.up{ color: var(--cyan); }
  #gestureTag.down{ color: var(--rose); }
  #gestureTag.none{ color: var(--ink-dim); }

  /* ---- HUD ---- */
  #hud{
    position:absolute; right:18px; bottom:18px; z-index:20;
    width:210px; border:1px solid var(--line);
    background: rgba(10,13,12,0.55); backdrop-filter: blur(6px);
    padding:12px 14px; border-radius:2px;
  }
  #hud h3{
    margin:0 0 8px 0; font-family: var(--serif); font-style:italic; font-weight:400;
    font-size:14px; letter-spacing:0.02em; color: var(--ink);
    border-bottom: 1px solid var(--line); padding-bottom:6px;
  }
  #bloomRow{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  #bloomTrack{ flex:1; height:5px; background: rgba(255,255,255,0.08); position:relative; border-radius:3px; overflow:hidden; }
  #bloomFill{ position:absolute; left:0; top:0; bottom:0; width:0%; background: linear-gradient(90deg, var(--cyan), var(--gold), var(--rose)); }
  #bloomPct{ font-size:11px; width:34px; text-align:right; color: var(--ink-dim); }
  #hint{ font-size:10.5px; line-height:1.6; color: var(--ink-dim); }
  #hint b{ color: var(--ink); font-weight:normal; }

  /* ---- title ---- */
  #title{
    position:absolute; top:18px; left:50%; transform:translateX(-50%);
    text-align:center; z-index:15; pointer-events:none;
  }
  #title h1{
    font-family: var(--serif); font-style:italic; font-weight:400;
    font-size:22px; margin:0; letter-spacing:0.02em; color: var(--ink);
    text-shadow: 0 0 18px rgba(0,0,0,0.6);
  }
  #title span{
    display:block; font-family: var(--mono); font-size:9px; letter-spacing:0.28em;
    text-transform:uppercase; color: var(--ink-dim); margin-top:4px;
  }

  /* ---- overlays ---- */
  #overlay{
    position:absolute; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    background: var(--bg);
    text-align:center; padding:24px;
  }
  #overlay.hidden{ display:none; }
  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:2px solid rgba(233,227,211,0.15); border-top-color: var(--cyan);
    animation: spin 0.9s linear infinite; margin-bottom:18px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #overlay h2{ font-family: var(--serif); font-style:italic; font-weight:400; font-size:20px; margin:0 0 8px 0; }
  #overlay p{ font-size:12px; color: var(--ink-dim); max-width:360px; line-height:1.6; margin:0 0 16px 0; }
  #retryBtn{
    font-family: var(--mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    background:transparent; color: var(--ink); border:1px solid var(--line);
    padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  #retryBtn:hover{ border-color: var(--cyan); color: var(--cyan); }
</style>
</head>
<body>

<div id="stage">
  <canvas id="art"></canvas>

  <div id="title">
    <h1>Cerebral Garden</h1>
    <span>a gesture-grown organism</span>
  </div>

  <div id="camWrap">
    <div id="camLabel"><span><span class="dot"></span>LIVE FEED</span><span id="fps">--fps</span></div>
    <div id="camBox">
      <video id="video" autoplay playsinline muted></video>
    </div>
    <div id="gestureTag" class="none">— no gesture —</div>
  </div>

  <div id="hud">
    <h3>Bloom State</h3>
    <div id="bloomRow">
      <div id="bloomTrack"><div id="bloomFill"></div></div>
      <div id="bloomPct">0%</div>
    </div>
    <div id="hint">
      <b>👍 Thumbs up</b> — bloom outward<br>
      <b>👎 Thumbs down</b> — wilt inward<br>
      Move your hand to paint light trails.
    </div>
  </div>

  <div id="overlay">
    <div class="spinner"></div>
    <h2 id="ovTitle">Loading recognition engine…</h2>
    <p id="ovText">Fetching the MediaPipe gesture model. This runs entirely in your browser.</p>
    <button id="retryBtn" style="display:none;">Try again</button>
  </div>
</div>

<script type="module">
import {
  GestureRecognizer,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

// ---------- DOM ----------
const video = document.getElementById('video');
const canvas = document.getElementById('art');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const retryBtn = document.getElementById('retryBtn');
const gestureTag = document.getElementById('gestureTag');
const bloomFill = document.getElementById('bloomFill');
const bloomPct = document.getElementById('bloomPct');
const fpsEl = document.getElementById('fps');

// ---------- canvas sizing ----------
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildHeadPath();
  buildFlowerSites();
}
window.addEventListener('resize', resize);

// ---------- global state ----------
let bloomState = 0.0;
let bloomTarget = 0.0;
let lastGesture = 'None';
let gestureScore = 0;
let gestureHold = 0; // frames of consistent gesture, for hysteresis
const HOLD_NEEDED = 3;

const trail = []; // {x,y,t}
const MAX_TRAIL = 900;

let gestureRecognizer = null;
let lastVideoTime = -1;
let running = false;

// fps tracking
let frameCount = 0, lastFpsT = performance.now();

// ---------- head profile geometry (built relative to canvas size) ----------
let headPath = null;      // Path2D-ish set of points for stroking
let brainOpening = null;  // {x,y,w} region where flowers emerge
let headAnchor = { x:0, y:0, scale:1 };

function buildHeadPath(){
  // Anchor the head profile left-of-center, facing right, sized relative to viewport height
  const scale = Math.min(H, W*0.9) * 0.62;
  const cx = W * 0.36;
  const cy = H * 0.56;
  headAnchor = { x: cx, y: cy, scale };

  // Normalized profile points (facing right), designed as a side head/neck silhouette
  // Coordinates roughly in range [-0.5,0.5] x, [-0.6,0.6] y, will be scaled.
  const pts = [
    [-0.10, -0.58], // crown back-top (opening starts)
    [ 0.06, -0.55], // crown front-top (opening ends)
    [ 0.20, -0.44], // forehead top
    [ 0.27, -0.28], // forehead
    [ 0.25, -0.14], // brow
    [ 0.30, -0.06], // nose bridge
    [ 0.34,  0.02], // nose tip
    [ 0.28,  0.06], // nostril
    [ 0.29,  0.11], // upper lip
    [ 0.25,  0.15], // mouth
    [ 0.26,  0.19], // lower lip
    [ 0.20,  0.24], // chin top
    [ 0.16,  0.30], // chin
    [ 0.06,  0.33], // jaw
    [-0.06,  0.34], // jaw back
    [-0.14,  0.32], // under jaw
    [-0.12,  0.40], // neck front
    [-0.14,  0.58], // neck front low
    [-0.30,  0.60], // neck base
    [-0.34,  0.44], // neck back
    [-0.33,  0.20], // back of head lower
    [-0.36,  0.00], // back of head
    [-0.32, -0.22], // back of head upper
    [-0.24, -0.42], // back crown
    [-0.10, -0.58], // close to crown back-top
  ];
  headPath = pts.map(([x,y]) => ({
    x: cx + x*scale,
    y: cy + y*scale
  }));

  // ear (simple loop) placed near jaw
  const earPts = [
    [-0.11, -0.02],[-0.02,-0.06],[0.03,0.00],[0.02,0.09],[-0.05,0.12],[-0.12,0.07],[-0.11,-0.02]
  ].map(([x,y]) => ({ x: cx + x*scale, y: cy + y*scale }));
  headAnchor.ear = earPts;

  // brain opening region (top of skull, between crown pts 0 and 1) — flowers emerge here
  const openA = headPath[0], openB = headPath[1];
  brainOpening = {
    x: (openA.x + openB.x)/2,
    y: (openA.y + openB.y)/2 - scale*0.03,
    w: Math.hypot(openB.x-openA.x, openB.y-openA.y),
    scale
  };
}

function smoothPath(ctx, pts, closeLoop=false){
  if(pts.length < 3) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length-1;i++){
    const midX = (pts[i].x + pts[i+1].x)/2;
    const midY = (pts[i].y + pts[i+1].y)/2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
  }
  ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
  if(closeLoop) ctx.closePath();
}

function drawHead(t){
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // faint brain glow behind opening, intensifies with bloom
  const g = ctx.createRadialGradient(
    brainOpening.x, brainOpening.y+brainOpening.scale*0.12, 4,
    brainOpening.x, brainOpening.y+brainOpening.scale*0.12, brainOpening.scale*0.5
  );
  const hue = lerp(178, 340, bloomState); // cyan -> rose
  g.addColorStop(0, `hsla(${hue},70%,60%,${0.10+0.22*bloomState})`);
  g.addColorStop(1, `hsla(${hue},70%,60%,0)`);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(brainOpening.x, brainOpening.y+brainOpening.scale*0.12, brainOpening.scale*0.5, 0, Math.PI*2);
  ctx.fill();

  // head silhouette line-art
  ctx.strokeStyle = 'rgba(233,227,211,0.72)';
  ctx.lineWidth = 1.4;
  smoothPath(ctx, headPath, true);
  ctx.stroke();

  // ear
  ctx.strokeStyle = 'rgba(233,227,211,0.5)';
  ctx.lineWidth = 1;
  smoothPath(ctx, headAnchor.ear, true);
  ctx.stroke();

  // subtle interior contour lines (like a schematic anatomical plate) - neck fold, jaw line accent
  ctx.strokeStyle = 'rgba(233,227,211,0.18)';
  ctx.lineWidth = 0.8;
  const s = headAnchor.scale, cx = headAnchor.x, cy = headAnchor.y;
  ctx.beginPath();
  ctx.moveTo(cx - 0.06*s, cy - 0.30*s);
  ctx.quadraticCurveTo(cx + 0.02*s, cy - 0.10*s, cx - 0.02*s, cy + 0.05*s);
  ctx.stroke();

  // sutures near crown opening (cracked-open cranium effect)
  ctx.strokeStyle = `hsla(${hue},60%,70%,${0.35+0.4*bloomState})`;
  ctx.lineWidth = 1;
  const oa = headPath[0], ob = headPath[1];
  ctx.beginPath();
  ctx.moveTo(oa.x, oa.y);
  ctx.lineTo(oa.x - s*0.02, oa.y - s*0.05*(0.4+bloomState));
  ctx.moveTo(ob.x, ob.y);
  ctx.lineTo(ob.x + s*0.02, ob.y - s*0.05*(0.4+bloomState));
  ctx.stroke();

  ctx.restore();
}

// ---------- procedural flowers ----------
let flowerSites = [];
function buildFlowerSites(){
  if(!brainOpening) return;
  flowerSites = [];
  const n = 6;
  for(let i=0;i<n;i++){
    const spread = (i/(n-1) - 0.5); // -0.5..0.5
    flowerSites.push({
      baseX: brainOpening.x + spread * brainOpening.w * 1.6,
      baseY: brainOpening.y + Math.abs(spread)*brainOpening.scale*0.05,
      seed: Math.random()*1000,
      heightMul: 0.7 + Math.random()*0.7,
      swaySeed: Math.random()*Math.PI*2,
      petals: 5 + Math.floor(Math.random()*3),
      sizeMul: 0.7 + Math.random()*0.6,
      hueShift: (Math.random()-0.5) * 40
    });
  }
}

function drawFlower(site, bloom, t){
  if(bloom <= 0.01) return;
  const s = headAnchor.scale;
  const stemLen = s * 0.42 * bloom * site.heightMul;
  const sway = Math.sin(t*0.0009 + site.swaySeed) * 0.05 * s * bloom;

  const baseX = site.baseX;
  const baseY = site.baseY;
  const tipX = baseX + sway * 0.6;
  const tipY = baseY - stemLen;
  const ctrlX = baseX + sway;
  const ctrlY = baseY - stemLen*0.55;

  const hue = lerp(172, 330, bloom) + site.hueShift;
  const stemAlpha = 0.5 + 0.4*bloom;

  ctx.save();
  // stem
  ctx.strokeStyle = `hsla(${lerp(150,120,bloom)}, 45%, ${lerp(35,45,bloom)}%, ${stemAlpha})`;
  ctx.lineWidth = Math.max(1, 2.2*bloom);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(baseX, baseY);
  ctx.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY);
  ctx.stroke();

  // small leaves along stem
  if(bloom > 0.25){
    const leafT = 0.55;
    const lx = baseX + (ctrlX-baseX)*leafT*0.9;
    const ly = baseY + (ctrlY-baseY)*leafT*0.9;
    ctx.strokeStyle = `hsla(140,40%,45%,${0.5*bloom})`;
    ctx.lineWidth = 1;
    for(const dir of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.quadraticCurveTo(lx + dir*s*0.05*bloom, ly - s*0.02, lx + dir*s*0.09*bloom, ly + s*0.01);
      ctx.stroke();
    }
  }

  // flower head at tip
  const petals = site.petals;
  const petalLen = s * 0.085 * bloom * site.sizeMul;
  const petalOpenEase = easeOutCubic(bloom);
  for(let i=0;i<petals;i++){
    const ang = (i/petals) * Math.PI*2 + site.seed;
    const px = tipX + Math.cos(ang) * petalLen * petalOpenEase;
    const py = tipY + Math.sin(ang) * petalLen * petalOpenEase * 0.9;
    const grad = ctx.createLinearGradient(tipX, tipY, px, py);
    grad.addColorStop(0, `hsla(${hue+i*4},75%,68%,${0.05+0.55*bloom})`);
    grad.addColorStop(1, `hsla(${hue+i*4},80%,60%,${0.55*bloom})`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    const midx = tipX + Math.cos(ang)*petalLen*0.55*petalOpenEase;
    const midy = tipY + Math.sin(ang)*petalLen*0.5*petalOpenEase;
    const perpX = Math.cos(ang+Math.PI/2)*petalLen*0.28*petalOpenEase;
    const perpY = Math.sin(ang+Math.PI/2)*petalLen*0.28*petalOpenEase;
    ctx.quadraticCurveTo(midx+perpX, midy+perpY, px, py);
    ctx.quadraticCurveTo(midx-perpX, midy-perpY, tipX, tipY);
    ctx.stroke();
  }

  // flower center glow
  ctx.fillStyle = `hsla(${hue+20},85%,70%,${0.65*bloom})`;
  ctx.shadowColor = `hsla(${hue+20},90%,65%,${0.8*bloom})`;
  ctx.shadowBlur = 14*bloom;
  ctx.beginPath();
  ctx.arc(tipX, tipY, Math.max(1,2.4*bloom), 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawFlowers(t){
  for(const site of flowerSites){
    drawFlower(site, bloomState, t);
  }
}

// ---------- hand trail ----------
function pushTrailPoint(nx, ny, t){
  // mirror x because video is mirrored for a natural "mirror" feel
  const x = (1 - nx) * W;
  const y = ny * H;
  trail.push({ x, y, t });
  if(trail.length > MAX_TRAIL) trail.shift();
}

function drawTrail(t){
  if(trail.length < 2) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  const hue = lerp(190, 40, bloomState);
  for(let i=1;i<trail.length;i++){
    const p0 = trail[i-1], p1 = trail[i];
    const age = (t - p1.t) / 9000; // fades over ~9s
    const alpha = Math.max(0, 1-age);
    if(alpha <= 0) continue;
    ctx.strokeStyle = `hsla(${hue}, 85%, 66%, ${alpha*0.55})`;
    ctx.shadowColor = `hsla(${hue}, 90%, 60%, ${alpha*0.7})`;
    ctx.shadowBlur = 8;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();
  }
  ctx.restore();
  // prune very old points occasionally
  while(trail.length && (t - trail[0].t) > 12000) trail.shift();
}

// ---------- utils ----------
function lerp(a,b,t){ return a + (b-a)*t; }
function easeOutCubic(t){ return 1 - Math.pow(1-t,3); }

// ---------- main render loop ----------
function render(now){
  ctx.clearRect(0,0,W,H);

  // background vignette wash
  const bg = ctx.createRadialGradient(W*0.5,H*0.4,0, W*0.5,H*0.4, Math.max(W,H)*0.75);
  bg.addColorStop(0, 'rgba(15,20,18,1)');
  bg.addColorStop(1, 'rgba(8,10,9,1)');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  drawTrail(now);
  drawHead(now);
  drawFlowers(now);

  // ---- bloomState lerp toward target, frame-rate independent ----
  const lerpSpeed = 1 - Math.pow(0.0015, 1/60); // approximate smooth factor
  bloomState += (bloomTarget - bloomState) * Math.min(1, lerpSpeed*2.2);
  bloomState = Math.min(1, Math.max(0, bloomState));

  bloomFill.style.width = (bloomState*100).toFixed(0) + '%';
  bloomPct.textContent = Math.round(bloomState*100) + '%';

  // fps
  frameCount++;
  if(now - lastFpsT > 500){
    const fps = Math.round(frameCount / ((now-lastFpsT)/1000));
    fpsEl.textContent = fps + 'fps';
    frameCount = 0; lastFpsT = now;
  }

  if(running) requestAnimationFrame(render);
}

// ---------- gesture recognition loop ----------
function updateGestureUI(name, score){
  if(name === 'Thumb_Up'){
    gestureTag.textContent = `👍 Thumb Up  (${Math.round(score*100)}%)`;
    gestureTag.className = 'up';
  } else if(name === 'Thumb_Down'){
    gestureTag.textContent = `👎 Thumb Down  (${Math.round(score*100)}%)`;
    gestureTag.className = 'down';
  } else {
    gestureTag.textContent = '— no gesture —';
    gestureTag.className = 'none';
  }
}

function predictLoop(){
  if(!running) return;
  if(video.readyState >= 2 && video.currentTime !== lastVideoTime){
    lastVideoTime = video.currentTime;
    const t = performance.now();
    const result = gestureRecognizer.recognizeForVideo(video, t);

    // gesture -> bloom target with simple hysteresis
    let name = 'None', score = 0;
    if(result.gestures && result.gestures.length > 0 && result.gestures[0].length > 0){
      name = result.gestures[0][0].categoryName;
      score = result.gestures[0][0].score;
    }
    if(score > 0.55 && (name === 'Thumb_Up' || name === 'Thumb_Down')){
      if(name === lastGesture){ gestureHold++; } else { gestureHold = 1; lastGesture = name; }
      if(gestureHold >= HOLD_NEEDED){
        bloomTarget = name === 'Thumb_Up' ? 1.0 : 0.0;
      }
    } else {
      lastGesture = 'None';
      gestureHold = 0;
    }
    updateGestureUI(gestureHold >= HOLD_NEEDED ? lastGesture : 'None', score);

    // hand centroid / index fingertip (landmark 8) trail
    if(result.landmarks && result.landmarks.length > 0){
      const lm = result.landmarks[0];
      const tip = lm[8] || lm[0];
      pushTrailPoint(tip.x, tip.y, t);
    }
  }
  requestAnimationFrame(predictLoop);
}

// ---------- setup ----------
async function setup(){
  try{
    showOverlay('Loading recognition engine…', 'Fetching the MediaPipe gesture model. This runs entirely in your browser.', false);
    const vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numHands: 1
    });

    showOverlay('Requesting camera access…', 'Please allow camera permissions when prompted. Nothing leaves your device.', false);
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(res => { video.onloadedmetadata = () => { video.play(); res(); }; });

    resize();
    hideOverlay();
    running = true;
    requestAnimationFrame(render);
    requestAnimationFrame(predictLoop);
  } catch(err){
    console.error(err);
    let msg = 'Something went wrong while starting the camera or model.';
    if(err && err.name === 'NotAllowedError'){
      msg = 'Camera access was denied. Please allow camera permissions in your browser settings and try again.';
    } else if(err && err.name === 'NotFoundError'){
      msg = 'No camera was found on this device.';
    }
    showOverlay('Unable to start', msg, true);
  }
}

function showOverlay(title, text, showRetry){
  overlay.classList.remove('hidden');
  ovTitle.textContent = title;
  ovText.textContent = text;
  retryBtn.style.display = showRetry ? 'inline-block' : 'none';
  overlay.querySelector('.spinner').style.display = showRetry ? 'none' : 'block';
}
function hideOverlay(){ overlay.classList.add('hidden'); }

retryBtn.addEventListener('click', () => { setup(); });

resize();
setup();
</script>
</body>
